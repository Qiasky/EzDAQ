<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EzDAQ EPS · 界面 Demo</title>
  <style>
    :root { --ink:#182534; --muted:#738194; --line:#e8edf2; --paper:#fff; --canvas:#f5f7f9; --brand:#157a70; --brand-soft:#e8f5f2; --danger:#d9564d; --danger-soft:#fff0ee; --amber:#cb8215; --amber-soft:#fff7e8; --ok:#27946b; --shadow:0 10px 26px rgba(22,42,60,.08); }
    *{box-sizing:border-box} body{margin:0;background:var(--canvas);font:14px/1.5 "Microsoft YaHei",system-ui,sans-serif;color:var(--ink)} button{font:inherit;cursor:pointer} .demo-bar{height:60px;padding:0 28px;background:#102c35;color:#e7f1f2;display:flex;align-items:center;justify-content:space-between;gap:18px}.brand{display:flex;align-items:center;gap:11px;font-weight:700;font-size:17px}.logo{width:29px;height:29px;border-radius:9px;background:#4dcbba;display:grid;place-items:center;color:#0b3637;font-weight:900}.demo-switcher{display:flex;gap:7px}.demo-switcher button{border:1px solid rgba(255,255,255,.25);background:transparent;color:#d7e4e5;border-radius:6px;padding:5px 10px}.demo-switcher button.active{background:#e8f5f2;color:#12594f;border-color:#e8f5f2}.shell{min-height:calc(100vh - 60px);display:grid;grid-template-columns:220px 1fr}.side{padding:22px 12px;background:#fff;border-right:1px solid var(--line)}.site-name{padding:7px 12px 20px;color:var(--muted);font-size:12px}.nav button{width:100%;display:flex;gap:10px;border:0;background:transparent;color:#58687a;border-radius:8px;padding:10px 12px;text-align:left;margin:3px 0}.nav button.active,.nav button:hover{background:var(--brand-soft);color:#14665d;font-weight:600}.main{padding:26px 30px;max-width:1500px;width:100%;margin:auto}.page-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:21px}.page-title h1{font-size:23px;margin:0;letter-spacing:-.4px}.page-title p{color:var(--muted);margin:3px 0 0}.last-update{color:var(--muted);font-size:12px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}.metric{background:var(--paper);border:1px solid var(--line);border-radius:11px;padding:17px;box-shadow:0 2px 5px rgba(20,44,65,.02)}.metric .label{color:var(--muted);font-size:12px}.metric b{display:block;font-size:27px;margin:3px 0}.metric small{color:var(--muted)}.metric.alert b{color:var(--danger)}.metric.ok b{color:var(--ok)}.panel{background:#fff;border:1px solid var(--line);border-radius:11px;box-shadow:0 2px 5px rgba(20,44,65,.02);margin-bottom:16px}.panel-head{padding:16px 18px 12px;display:flex;align-items:center;justify-content:space-between}.panel-head h2{font-size:15px;margin:0}.panel-head span{color:var(--muted);font-size:12px}.room-grid{display:grid;grid-template-columns:1.25fr 1fr;gap:16px}.room{padding:18px}.room-map{height:240px;background:linear-gradient(135deg,#f7faf9,#eaf3f2);border:1px solid #dce9e7;border-radius:9px;position:relative;overflow:hidden}.rack{position:absolute;width:70px;height:120px;border:2px solid #6e8592;border-radius:4px;background:repeating-linear-gradient(0deg,rgba(81,113,125,.12) 0 4px,transparent 4px 16px)}.rack:after{content:"";position:absolute;right:6px;top:9px;width:5px;height:5px;border-radius:50%;background:#54b98d;box-shadow:0 20px #54b98d,0 40px #54b98d,0 60px #54b98d}.sensor{position:absolute;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:16px;background:#fff;border:1px solid #cfe1df;box-shadow:var(--shadow)}.sensor.bad{border-color:#e9938e;background:var(--danger-soft)}.map-label{position:absolute;left:15px;top:12px;color:#647482;font-size:12px}.status-list{padding:0 18px 12px}.status-row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}.status-row:last-child{border:0}.status-name{display:flex;gap:9px;align-items:center}.dot{width:8px;height:8px;border-radius:50%;background:var(--ok)}.dot.warn{background:var(--amber)}.dot.bad{background:var(--danger)}.badge{font-size:12px;padding:3px 8px;border-radius:20px;background:var(--brand-soft);color:#187366}.badge.bad{color:#bc443c;background:var(--danger-soft)}.badge.warn{color:#9b6312;background:var(--amber-soft)}.alerts{padding:0 18px 12px}.alert-row{display:grid;grid-template-columns:8px 1fr auto;gap:11px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}.alert-row:last-child{border:0}.level{width:8px;height:36px;border-radius:5px;background:var(--amber)}.level.danger{background:var(--danger)}.alert-row p{margin:0;font-weight:600}.alert-row small{color:var(--muted)}.text-button{border:0;background:none;color:var(--brand);font-size:12px;padding:4px}.device-table{width:100%;border-collapse:collapse}.device-table th,.device-table td{text-align:left;padding:12px 18px;border-bottom:1px solid var(--line)}.device-table th{color:var(--muted);font-size:12px;font-weight:500;background:#fbfcfd}.device-table td:last-child{text-align:right}.button{border:0;border-radius:7px;padding:8px 12px;background:var(--brand);color:#fff;font-weight:600}.button.secondary{background:#eff4f4;color:#32645f}.toast{position:fixed;right:25px;bottom:24px;background:#183f42;color:white;padding:12px 16px;border-radius:8px;box-shadow:var(--shadow);display:none;z-index:5}.toast.show{display:block}.mobile-frame{max-width:390px;margin:14px auto;background:#fff;min-height:720px;border:10px solid #17232b;border-radius:35px;box-shadow:0 22px 45px rgba(19,35,43,.22);overflow:hidden}.mobile-top{background:#157a70;color:#fff;padding:26px 20px 20px}.mobile-top h1{font-size:19px;margin:5px 0}.mobile-top small{opacity:.78}.mobile-body{padding:15px;background:#f5f7f9;min-height:620px}.mobile-summary{display:grid;grid-template-columns:1fr 1fr;gap:10px}.mobile-card{background:#fff;padding:13px;border-radius:10px;border:1px solid var(--line)}.mobile-card b{font-size:22px}.mobile-section{font-weight:700;margin:19px 0 9px}.mobile-nav{position:sticky;bottom:0;display:flex;background:#fff;border-top:1px solid var(--line);justify-content:space-around;padding:9px 0;color:#6e7e8c;font-size:11px}.mobile-nav span.active{color:var(--brand);font-weight:bold}.mini-frame{max-width:375px;margin:14px auto;background:#f7f7f7;min-height:720px;border-radius:5px;box-shadow:0 12px 35px rgba(19,35,43,.15);overflow:hidden}.mini-top{height:58px;background:#fff;padding:18px;text-align:center;font-weight:700}.mini-body{padding:14px}.mini-overview{background:linear-gradient(135deg,#1c8175,#49a999);color:#fff;padding:18px;border-radius:12px}.mini-overview b{font-size:29px;display:block;margin:8px 0}.mini-list{background:#fff;border-radius:12px;margin-top:13px;padding:0 14px}.mini-list .status-row{font-size:13px}.windows-shell{background:#e6edf0;border:1px solid #aebbc0;box-shadow:0 13px 35px rgba(20,39,48,.18);max-width:1180px;margin:18px auto}.win-title{background:#f6f8f9;border-bottom:1px solid #bdc9cd;padding:8px 12px;font-size:12px;display:flex;justify-content:space-between}.win-menu{background:#fff;border-bottom:1px solid #ccd7da;padding:8px 12px;font-size:12px;color:#4c5d65}.win-content{padding:12px;display:grid;grid-template-columns:190px 1fr;gap:12px}.win-tree,.win-panel{background:#fff;border:1px solid #cad5d9;min-height:480px}.win-tree{padding:12px;font-size:13px}.win-tree p{padding:6px;margin:0}.win-tree p.active{background:#dbeeea;color:#13645c}.win-panel{padding:15px}.win-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.win-stat{border:1px solid #d7e0e3;padding:10px;background:#fbfcfc}.win-stat b{font-size:20px;display:block}.win-chart{height:180px;margin-top:14px;border:1px solid #d7e0e3;background:linear-gradient(#fff,#f9fbfb);position:relative;overflow:hidden}.chart-line{position:absolute;inset:35px 15px 18px;background:linear-gradient(165deg,transparent 0 27%,#278d80 27.6% 28.5%,transparent 29% 40%,#278d80 40.6% 41.5%,transparent 42% 54%,#278d80 54.6% 55.5%,transparent 56% 68%,#278d80 68.6% 69.5%,transparent 70%);opacity:.75}.hidden{display:none!important}@media(max-width:800px){.demo-bar{padding:0 12px}.brand span{display:none}.shell{grid-template-columns:1fr}.side{display:none}.main{padding:18px 13px}.metrics{grid-template-columns:1fr 1fr}.room-grid{grid-template-columns:1fr}.page-title{align-items:flex-start}.last-update{display:none}}@media(max-width:460px){.demo-switcher button{padding:5px 7px;font-size:11px}.demo-switcher{gap:3px}.metrics{gap:8px}.metric{padding:12px}.metric b{font-size:22px}}
  </style>
<style>
.demo-toolbar{display:flex;gap:8px;align-items:center}.sim-pill{font-size:12px;color:#177368;background:#e8f5f2;padding:5px 9px;border-radius:20px}.modal-shade{position:fixed;inset:0;background:rgba(11,29,36,.45);display:grid;place-items:center;padding:18px;z-index:20}.modal{width:min(600px,100%);background:#fff;border-radius:12px;box-shadow:0 22px 50px rgba(8,24,30,.25);overflow:hidden}.modal-head{padding:17px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.modal-head h2{font-size:17px;margin:0}.modal-body{padding:18px 20px}.modal-foot{padding:13px 20px;background:#f8fafb;display:flex;justify-content:flex-end;gap:8px}.close{border:0;background:transparent;font-size:22px;color:#71808d}.kv{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line)}.form-row{display:grid;grid-template-columns:100px 1fr;gap:10px;align-items:center;margin:12px 0}.form-row input,.form-row select,.form-row textarea{width:100%;padding:8px;border:1px solid #d6e0e4;border-radius:6px;font:inherit}.form-row textarea{min-height:65px}.clickable{cursor:pointer}.clickable:hover{background:#f5fbfa}@media(max-width:700px){.demo-toolbar{flex-wrap:wrap}.form-row{grid-template-columns:1fr}}

</style>
</head>
<body>
  <header class="demo-bar"><div class="brand"><span class="logo">E</span><span>EzDAQ EPS <em style="font-style:normal;font-weight:400;opacity:.65">界面流程 Demo</em></span></div><div class="demo-switcher"><button class="active" data-view="web">Web 管理端</button><button data-view="mobile">手机 APP</button><button data-view="mini">微信小程序</button><button data-view="windows">Windows 上位机</button></div></header>
  <main id="web" class="view"><div class="shell"><aside class="side"><div class="site-name">当前站点<br><b style="color:#243442;font-size:14px">上海 · 浦东数据中心</b></div><nav class="nav"><button class="active" data-page="overview">▦　总览</button><button data-page="alerts">⚠　告警中心 <span id="navAlert" style="margin-left:auto">3</span></button><button data-page="devices">▣　设备与机房</button><button data-page="reports">⌁　趋势与报表</button><button data-page="settings">⚙　配置中心</button></nav></aside><section class="main" id="webContent"></section></div></main>
  <main id="mobile" class="view hidden"></main><main id="mini" class="view hidden"></main><main id="windows" class="view hidden"></main><div id="toast" class="toast"></div>
  

<script>
const state = { page:'overview', alerts:[
  {id:'A-20260902-003',level:'紧急',title:'UPS-01 电池容量过低',detail:'当前 37%，低于阈值 40%',time:'10:18',status:'待确认'},
  {id:'A-20260902-002',level:'严重',title:'机房 A 温度偏高',detail:'当前 29.6℃，阈值 28℃',time:'09:42',status:'处理中'},
  {id:'A-20260902-001',level:'一般',title:'新风机通讯中断',detail:'已离线 6 分钟',time:'09:21',status:'待确认'}
] };
function toast(text) { const el=document.querySelector('#toast'); if (!el) return; el.textContent=text; el.classList.add('show'); setTimeout(()=>el.classList.remove('show'),2400); }
function showPage(page) { state.page=page; renderWeb(); }
function renderWeb() { const target=document.querySelector('#webContent'); if (!target) return; const pages={overview,alerts,devices,reports,settings}; target.innerHTML=pages[state.page](); document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===state.page)); const count=document.querySelector('#navAlert'); if (count) count.textContent=state.alerts.filter(a=>a.status==='待确认').length; }
document.querySelectorAll('[data-view]').forEach(button=>button.addEventListener('click',()=>{document.querySelectorAll('[data-view]').forEach(item=>item.classList.toggle('active',item===button));document.querySelectorAll('.view').forEach(view=>view.classList.add('hidden'));document.querySelector('#'+button.dataset.view).classList.remove('hidden');}));
document.addEventListener('click',event=>{const button=event.target.closest('[data-page]');if(button)showPage(button.dataset.page);});

/* Interactive prototype layer. Every reading is simulated in this browser only. */
const demo={temp:29.6,humidity:51,battery:37,online:18};
const $demo=s=>document.querySelector(s);
function stamp(){return new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'});}
function modal(title,content,actions){document.querySelector('.modal-shade')?.remove();document.body.insertAdjacentHTML('beforeend',`<div class="modal-shade" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="modal-head"><h2>${title}</h2><button class="close" onclick="closeModal()">×</button></div><div class="modal-body">${content}</div><div class="modal-foot">${actions||'<button class="button secondary" onclick="closeModal()">关闭</button>'}</div></div></div>`)}
function closeModal(){document.querySelector('.modal-shade')?.remove()}
function active(){return state.alerts.filter(a=>a.status!=='已恢复'&&a.status!=='已关闭')}
function simulate(){demo.temp=Math.max(23,Math.min(33,+(demo.temp+(Math.random()*3-1)).toFixed(1)));demo.humidity=Math.round(43+Math.random()*18);demo.battery=Math.max(25,demo.battery-Math.floor(Math.random()*3));if(demo.temp>=28&&!state.alerts.some(a=>a.id==='SIM-001'&&a.status!=='已恢复'))state.alerts.unshift({id:'SIM-001',level:demo.temp>30?'紧急':'严重',title:'机房 A 温度阈值告警',detail:`当前 ${demo.temp}℃，阈值 28℃`,time:stamp(),status:'待确认'});if(demo.temp<27.5){let a=state.alerts.find(a=>a.id==='SIM-001');if(a)a.status='已恢复'}renderDemo();toast(`模拟采集完成：${demo.temp}℃ / ${demo.humidity}%RH`)}
function confirmAlert(id){let a=state.alerts.find(a=>a.id===id);if(a){a.status='处理中';renderDemo();toast('告警已确认，已模拟发送处理通知')}}
function alertDetail(id){let a=state.alerts.find(a=>a.id===id);if(!a)return;modal('告警详情',`<div class="kv"><span>告警编号</span><b>${a.id}</b></div><div class="kv"><span>告警内容</span><b>${a.title}</b></div><div class="kv"><span>触发条件</span><span>${a.detail}</span></div><div class="kv"><span>发生时间</span><span>${a.time}</span></div><div class="kv"><span>通知记录</span><span>企业微信、飞书已发送</span></div><div class="form-row"><label>处理备注</label><textarea id="note" placeholder="例如：已安排现场检查"></textarea></div>`,a.status==='待确认'?`<button class="button secondary" onclick="closeModal()">取消</button><button class="button" onclick="confirmAlert('${id}');closeModal()">确认告警</button>`:`<button class="button" onclick="closeAlert('${id}')">保存处理记录</button>`)}
function closeAlert(id){let a=state.alerts.find(a=>a.id===id);a.status='已关闭';a.note=document.querySelector('#note').value;closeModal();renderDemo();toast('告警处理记录已保存')}
function deviceDetail(key){let data={temp:['温湿度传感器-01','环境','机房 A · 东侧',`${demo.temp} ℃`],ups:['UPS-01','动力','机房 A · 供电区',`${demo.battery}%`],door:['门禁-01','安保','机房 A · 主入口','门已关闭'],fan:['新风机-01','环境','机房 A · 西侧','设备离线']}[key];modal(data[0],`<div class="kv"><span>设备类型</span><b>${data[1]}</b></div><div class="kv"><span>安装位置</span><span>${data[2]}</span></div><div class="kv"><span>在线状态</span><span class="badge ${key==='fan'?'bad':''}">${key==='fan'?'离线':'在线'}</span></div><div class="kv"><span>当前读数</span><b>${data[3]}</b></div><div class="win-chart" style="height:130px;margin-top:16px"><div class="chart-line"></div><span style="position:absolute;left:12px;top:8px;font-size:12px">最近 24 小时模拟趋势</span></div>`,`<button class="button secondary" onclick="closeModal()">关闭</button><button class="button" onclick="simulate();closeModal()">模拟设备数据</button>`)}
function addDevice(){modal('添加模拟设备',`<div class="form-row"><label>设备名称</label><input id="newDevice" value="温湿度传感器-02"></div><div class="form-row"><label>设备类型</label><select><option>环境监测</option><option>动力设备</option><option>安保设备</option></select></div><div class="form-row"><label>所属机房</label><select><option>机房 A</option><option>机房 B</option></select></div><small style="color:#738194">仅模拟本次会话中的接入结果。</small>`,`<button class="button secondary" onclick="closeModal()">取消</button><button class="button" onclick="saveDevice()">保存并接入</button>`)}
function saveDevice(){demo.online++;closeModal();renderDemo();toast('模拟设备已接入并开始采集')}
function noticeSetting(){modal('通知策略',`<div class="form-row"><label>告警等级</label><select><option>紧急、严重</option><option>全部</option></select></div><div class="form-row"><label>通知渠道</label><span><label><input type="checkbox" checked> 企业微信</label> <label><input type="checkbox" checked> 飞书</label> <label><input type="checkbox"> 短信</label></span></div><div class="form-row"><label>重复提醒</label><select><option>每 15 分钟一次</option><option>不重复</option></select></div>`,`<button class="button secondary" onclick="closeModal()">取消</button><button class="button" onclick="closeModal();toast('通知策略已保存（模拟）')">保存</button>`)}
function badge(l){return `<span class="badge ${l==='紧急'?'bad':l==='严重'?'warn':''}">${l}</span>`}
function alertRows(){return active().map(a=>`<div class="alert-row"><i class="level ${a.level==='紧急'?'danger':''}"></i><div class="clickable" onclick="alertDetail('${a.id}')"><p>${a.title} ${badge(a.level)}</p><small>${a.detail} · ${a.time} · ${a.status}</small></div>${a.status==='待确认'?`<button class="text-button" onclick="confirmAlert('${a.id}')">确认告警</button>`:`<button class="text-button" onclick="alertDetail('${a.id}')">查看详情</button>`}</div>`).join('')}
function overview(){return `<div class="page-title"><div><h1>运行总览</h1><p>上海 · 浦东数据中心　/　机房 A</p></div><div class="demo-toolbar"><span class="sim-pill">模拟数据 · ${stamp()}</span><button class="button" onclick="simulate()">↻ 采集一组模拟数据</button></div></div><div class="metrics"><div class="metric ok clickable" onclick="showPage('devices')"><span class="label">在线设备</span><b>${demo.online}<small>/ 19</small></b><small>点击查看设备</small></div><div class="metric alert clickable" onclick="showPage('alerts')"><span class="label">当前告警</span><b>${active().length}</b><small>点击处理告警</small></div><div class="metric clickable" onclick="deviceDetail('temp')"><span class="label">机房温度</span><b>${demo.temp}℃</b><small style="color:#cb8215">点击查看趋势</small></div><div class="metric clickable" onclick="deviceDetail('ups')"><span class="label">UPS 电池容量</span><b>${demo.battery}%</b><small style="color:#d9564d">点击查看设备</small></div></div><div class="room-grid"><div class="panel room"><div class="panel-head"><h2>机房设备状态</h2><button class="text-button" onclick="showPage('devices')">查看设备 →</button></div><div class="room-map"><span class="map-label">机房 A · 3F</span><div class="rack" style="left:25%;top:60px"></div><div class="rack" style="left:52%;top:60px"></div><button class="sensor bad" style="left:14%;top:45px" onclick="deviceDetail('temp')">🌡</button><button class="sensor" style="left:78%;top:60px" onclick="deviceDetail('ups')">⚡</button><button class="sensor" style="left:79%;top:154px" onclick="deviceDetail('door')">▣</button></div></div><div class="panel"><div class="panel-head"><h2>重点状态</h2><button class="text-button" onclick="simulate()">刷新数据</button></div><div class="status-list"><div class="status-row clickable" onclick="deviceDetail('temp')"><span>机房温度</span><b style="color:#d9564d">${demo.temp}℃</b></div><div class="status-row clickable" onclick="deviceDetail('ups')"><span>UPS-01 电池</span><b style="color:#cb8215">${demo.battery}%</b></div><div class="status-row clickable" onclick="deviceDetail('door')"><span>门禁状态</span><b>关闭</b></div></div></div></div><div class="panel"><div class="panel-head"><h2>待处置告警</h2><button class="text-button" onclick="showPage('alerts')">查看全部 →</button></div><div class="alerts">${alertRows()||'<p style="padding:16px;color:#738194">暂无待处理告警</p>'}</div></div>`}
function alerts(){return `<div class="page-title"><div><h1>告警中心</h1><p>查看、确认并记录每一条异常的处置过程</p></div><div class="demo-toolbar"><button class="button secondary" onclick="modal('筛选告警','<div class=\'form-row\'><label>告警等级</label><select><option>全部等级</option><option>紧急</option><option>严重</option></select></div>','<button class=\'button\' onclick=\'closeModal();toast(\"已应用筛选（模拟）\")\'>应用</button>')">筛选 ▾</button><button class="button" onclick="simulate()">模拟新数据</button></div></div><div class="panel"><table class="device-table"><thead><tr><th>告警内容</th><th>等级</th><th>发生时间</th><th>状态</th><th>操作</th></tr></thead><tbody>${state.alerts.map(a=>`<tr class="clickable" onclick="alertDetail('${a.id}')"><td><b>${a.title}</b><br><small>${a.detail}</small></td><td>${badge(a.level)}</td><td>${a.time}</td><td>${a.status}</td><td onclick="event.stopPropagation()"><button class="text-button" onclick="alertDetail('${a.id}')">详情</button></td></tr>`).join('')}</tbody></table></div>`}
function devices(){let rows=[['temp','温湿度传感器-01','环境',`温度 ${demo.temp}℃`],['ups','UPS-01','动力',`电池 ${demo.battery}%`],['door','门禁-01','安保','门已关闭'],['fan','新风机-01','环境','设备离线']];return `<div class="page-title"><div><h1>设备与机房</h1><p>19 台设备 · 58 个监控点</p></div><div class="demo-toolbar"><button class="button secondary" onclick="simulate()">刷新全部数据</button><button class="button" onclick="addDevice()">+ 添加设备</button></div></div><div class="panel"><table class="device-table"><thead><tr><th>设备名称</th><th>类型</th><th>关键状态</th><th>最后上报</th><th></th></tr></thead><tbody>${rows.map(r=>`<tr class="clickable" onclick="deviceDetail('${r[0]}')"><td><b>${r[1]}</b><br><small>机房 A</small></td><td>${r[2]}</td><td>${r[3]}</td><td>刚刚</td><td><button class="text-button">详情</button></td></tr>`).join('')}</tbody></table></div>`}
function reports(){return `<div class="page-title"><div><h1>趋势与报表</h1><p>温湿度传感器-01 · 最近 24 小时</p></div><div class="demo-toolbar"><button class="button secondary" onclick="toast('已模拟导出 CSV 文件')">导出 CSV</button><button class="button" onclick="simulate()">刷新趋势数据</button></div></div><div class="panel" style="padding:18px"><div class="win-chart" style="height:290px"><div class="chart-line"></div><span style="position:absolute;right:14px;top:12px;color:#d9564d">当前 ${demo.temp}℃ / ${demo.humidity}%RH</span></div></div>`}
function settings(){return `<div class="page-title"><div><h1>配置中心</h1><p>管理阈值、通知与权限</p></div><button class="button" onclick="noticeSetting()">编辑通知策略</button></div><div class="panel"><div class="status-list"><div class="status-row clickable" onclick="modal('温度阈值规则','<div class=\'form-row\'><label>触发条件</label><input value=\'温度 ≥ 28℃ 持续 5 分钟\'></div>','<button class=\'button\' onclick=\'closeModal();toast(\"阈值规则已保存（模拟）\")\'>保存</button>')"><span><b>温度过高</b><br><small>温度 ≥ 28℃ 持续 5 分钟</small></span><span class="badge warn">严重</span></div><div class="status-row clickable" onclick="deviceDetail('ups')"><span><b>UPS 电池容量低</b><br><small>容量 ≤ 40% 持续 3 分钟</small></span><span class="badge bad">紧急</span></div><div class="status-row clickable" onclick="noticeSetting()"><span><b>通知策略</b><br><small>企业微信、飞书、短信</small></span><button class="text-button">编辑</button></div></div></div>`}
function renderDemo(){renderWeb();renderMobile();renderMini();renderWindows()}
function renderMobile(){document.querySelector('#mobile').innerHTML=`<div class="mobile-frame"><div class="mobile-top"><small>上海 · 浦东数据中心</small><h1>早上好，王工</h1><small>更新于 ${stamp()}</small></div><div class="mobile-body"><button class="button" style="width:100%" onclick="simulate()">↻ 现场刷新模拟数据</button><div class="mobile-summary" style="margin-top:10px"><div class="mobile-card clickable" onclick="showPage('alerts');document.querySelector('[data-view=web]').click()">当前告警<b style="color:#d9564d">${active().length}</b></div><div class="mobile-card clickable" onclick="deviceDetail('temp')">机房温度<b>${demo.temp}℃</b></div></div><div class="mobile-section">需要关注</div>${active().slice(0,2).map(a=>`<div class="mobile-card clickable" onclick="alertDetail('${a.id}')" style="margin-bottom:9px"><b>${a.title}</b><br><small>${a.status}</small></div>`).join('')}</div><div class="mobile-nav"><span class="active">▦<br>首页</span><span onclick="showPage('alerts');document.querySelector('[data-view=web]').click()">⚠<br>告警</span><span onclick="showPage('devices');document.querySelector('[data-view=web]').click()">▣<br>设备</span><span onclick="noticeSetting()">我<br>的</span></div></div>`}
function renderMini(){document.querySelector('#mini').innerHTML=`<div class="mini-frame"><div class="mini-top">EzDAQ EPS</div><div class="mini-body"><div class="mini-overview clickable" onclick="showPage('alerts');document.querySelector('[data-view=web]').click()"><small>浦东数据中心</small><b>${active().length} 条待处理告警</b><small>点击处理现场异常</small></div><button class="button" style="margin-top:13px;width:100%" onclick="simulate()">模拟现场刷新</button><div class="mobile-section">快捷查看</div><div class="mobile-summary"><div class="mobile-card clickable" onclick="deviceDetail('temp')">环境<br><b>${demo.temp}℃</b></div><div class="mobile-card clickable" onclick="deviceDetail('ups')">动力<br><b>${demo.battery}%</b></div></div><div class="mini-list">${active().map(a=>`<div class="status-row clickable" onclick="alertDetail('${a.id}')"><span>${a.title}</span>${badge(a.level)}</div>`).join('')}</div></div></div>`}
function renderWindows(){document.querySelector('#windows').innerHTML=`<div class="windows-shell"><div class="win-title">EzDAQ EPS 上位机监控中心 <span style="float:right">—　□　×</span></div><div class="win-menu">文件　监控　告警　报表 <button class="text-button" style="float:right" onclick="simulate()">刷新模拟数据</button></div><div class="win-content"><aside class="win-tree"><b>监控站点</b><p class="active clickable" onclick="showPage('overview');document.querySelector('[data-view=web]').click()">▣ 浦东数据中心</p><p class="clickable" onclick="deviceDetail('temp')">　▣ 机房 A</p></aside><section class="win-panel"><h3>浦东数据中心 · 实时监控</h3><div class="win-stats"><div class="win-stat">在线设备<b>${demo.online}/19</b></div><div class="win-stat">当前告警<b>${active().length}</b></div><div class="win-stat">机房温度<b>${demo.temp}℃</b></div><div class="win-stat">UPS 电池<b>${demo.battery}%</b></div></div><div class="win-chart"><div class="chart-line"></div></div>${alertRows()}</section></div></div>`}
document.querySelector('.brand').insertAdjacentHTML('beforeend', '<span id="prototypeVersion" style="font-size:11px;font-weight:500;background:#4dcbba;color:#0b3637;padding:2px 6px;border-radius:8px">互动原型 v2</span>');
renderDemo();

</script>
</body>
</html>
